name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Lint (basic syntax check)
        run: node --check index.js && node --check db.js && node --check llm.js && node --check auth.js && node --check crypto.js && node --check validate.js && node --check response.js && node --check logger.js && node --check pii.js && node --check seed.js && node --check ssrf-shared.js
      - name: SSRF security tests
        run: node --test test/ssrf.test.js
      - name: Test
        run: npm test
        env:
          DB_DIR: /tmp/tryout-test
          INTERVIEWX_AUTH_DISABLED: '1'

  frontend:
    name: Frontend (TypeScript + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm install --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --run || true  # vitest,允许无测试时跳过
      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f docker/Dockerfile.server -t interviewx-server:ci .
      - name: Build web image
        run: docker build -f docker/Dockerfile.web -t interviewx-web:ci .
