name: 功能建议
description: 提出新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题是什么
      description: 先说问题，不要直接说方案——这有助于我们找到真正需要解决的东西
      placeholder: 作为后端求职者，我希望能…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的解决方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
    validations:
      required: false

  - type: checkboxes
    id: kind
    attributes:
      label: 这是什么类型
      options:
        - label: 新功能
        - label: 已有功能的体验改进
        - label: 性能 / 稳定性
        - label: 文档
