server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行时解析后端：后端缺席时独立启动(502)，换 IP 自动跟随。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://server:3001;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # v10.2.5:用 $remote_addr 替换(而非 $proxy_add_x_forwarded_for 追加)
        # 替换模式:XFF 只含真实客户端 IP,不含攻击者注入的值
        # 配合后端 BEHIND_PROXY=1,Express trust proxy=1 取 XFF 最后一段(即此处的 $remote_addr)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";

        # SSE 流式支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
