services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: tryout-server
    ports:
      - "3001:3001"
    volumes:
      - tryout-data:/data
    environment:
      - PORT=3001
      - DB_DIR=/data
      - DOCKER=1
      - NODE_ENV=production
      # 后端在 Nginx 反代后,信任一层 XFF(配合 nginx.conf 的 $remote_addr 替换模式)
      # 让限流基于真实客户端 IP,而非 Nginx 容器 IP(127.0.0.1)
      - BEHIND_PROXY=1
      # 如果用 Ollama 本地模型,设置宿主机地址:
      - OLLAMA_URL=http://host.docker.internal:11434/v1
      # 日 token 预算(默认 50万)
      - DAILY_TOKEN_BUDGET=500000
      # CORS 白名单(逗号分隔)
      - CORS_ORIGINS=http://localhost:5173,http://localhost:1420,http://localhost:9090
    restart: unless-stopped
    # 资源限制 + 日志限制
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: tryout-web
    ports:
      - "9090:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  tryout-data:
